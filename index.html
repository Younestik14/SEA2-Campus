<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e293b">
    <title>SEA2 Campus - Plataforma de Aprendizaje</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="logo-icon">⚡</span>
                <h1>SEA2 Campus</h1>
            </div>
            <button id="theme-toggle" class="btn-icon" aria-label="Cambiar tema">🌙</button>
        </div>
    </header>

    <main class="main-layout">
        <section class="dashboard-card">
            <h2>Mi Progreso</h2>
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <span id="progress-text" class="progress-status">0% completado</span>
            </div>
        </section>

        <section class="content-section">
            <div class="section-header">
                <h2>Unidades de Estudio</h2>
                <div class="filter-controls">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="pending">Pendientes</button>
                    <button class="filter-btn" data-filter="completed">Completadas</button>
                </div>
            </div>

            <div id="lessons-grid" class="lessons-grid">
                <!-- Las lecciones se renderizan dinámicamente desde lessons.js -->
            </div>
        </section>
    </main>

    <!-- Modal de Lectura de Lección -->
    <div id="lesson-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-overlay" tabindex="-1" data-close="true"></div>
        <div class="modal-card">
            <header class="modal-header">
                <h3 id="modal-title">Título de la Lección</h3>
                <button class="close-btn" data-close="true">&times;</button>
            </header>
            <div id="modal-body" class="modal-body">
                <!-- Contenido de la lección -->
            </div>
            <footer class="modal-footer">
                <button id="mark-complete-btn" class="btn btn-primary">Marcar como Completada</button>
            </footer>
        </div>
    </div>

    <!-- Carga ordenada e independiente de scripts -->
    <script src="lessons.js"></script>
    <script src="enhancements.js"></script>
    <script src="app.js"></script>
</body>
</html>
